[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-database-agent"
version = "1.0.0"
description = "A commercial database management agent based on ReAct pattern, featuring RAG, data visualization, and streaming chat interface."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ddtaffyl"}
]
keywords = ["langchain", "agent", "rag", "fastapi", "database", "visualization"]

dependencies = [
    # Web Framework
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",  # FastAPI 处理表单文件上传需要

    # LangChain & AI Core
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.5",  # 用于 ChatOpenAI 和 OpenAIEmbeddings
    "langchain-chroma>=0.1.0",  # 用于 Chroma 向量存储集成
    "langgraph>=0.0.20",        # 用于 Agent State 和 Middleware
    
    # Database & ORM
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",           # MySQL 驱动
    
    # Vector Store & Embeddings
    "chromadb>=0.4.0",
    
    # Data Processing & Visualization
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",            # 虽然代码未直接显示 import pandas，但处理表格数据通常隐含需要，且 langchain 某些 loader 依赖它
    
    # Configuration & Utils
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",     # 用于加载 .env 中的 API Key
    
    # Document Loaders
    "pypdf>=3.0.0",             # 用于 PDF 加载
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "api*", "app*", "model*", "rag*", "utils*"]
exclude = ["tests*", "data*", "logs*", "img*", "chroma_db*"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3